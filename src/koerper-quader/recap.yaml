# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für dieses Kapitel
description: Ebene Figuren auffrischen und prüfen, ob du bereit bist für Körper.
competencies: [grundfiguren-eben]
blocks:
  - type: section
    id: wofuer
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text: |
          Körper bestehen aus Flächen, und viele Flächen sind ebene Figuren. Darum brauchst du in diesem Kapitel die ebenen
          Grundfiguren: Quadrat, Rechteck, Dreieck, Kreis und Vieleck. Lies die Begriffe und löse die Aufgaben. Wenn du sie
          schaffst, kannst du loslegen. Wenn nicht, lies die Seite zu den ebenen Grundfiguren nach (Link unten).
  - type: section
    id: grundfiguren
    title: Ebene Grundfiguren
    blocks:
      - type: definition
        term: Seite und Ecke
        explanation: Eine Seite ist eine gerade Strecke am Rand einer ebenen Figur. Eine Ecke ist ein Punkt, an dem zwei Seiten zusammenstoßen. Bei Körpern heißen die Strecken Kanten, bei ebenen Figuren heißen sie Seiten.
      - type: definition
        term: Quadrat und Rechteck
        explanation: Ein Quadrat hat vier gleich lange Seiten und vier rechte Winkel. Ein rechter Winkel ist eine Ecke wie die einer Heftseite, die beiden Seiten stehen senkrecht aufeinander. Ein Rechteck hat vier rechte Winkel. Gegenüberliegende Seiten sind gleich lang und parallel, das heißt, sie haben überall den gleichen Abstand.
      - type: single-choice
        id: recap-quadrat
        text: Welche Figur hat immer vier gleich lange Seiten?
        options:
          - text: Das Quadrat
            correct: true
            info: Beim Quadrat sind alle vier Seiten gleich lang.
          - text: Das Rechteck
            correct: false
            info: Beim Rechteck sind nur die gegenüberliegenden Seiten gleich lang. Ein Rechteck mit vier gleich langen Seiten wäre ein Quadrat.
          - text: Das Dreieck
            correct: false
            info: Ein Dreieck hat nur drei Seiten, nicht vier.
        explanation: Das Quadrat ist die Figur, bei der alle vier Seiten gleich lang sind und alle vier Winkel rechte Winkel.
        links:
          - title: Ebene Grundfiguren (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/grundfiguren-eben/
      - type: definition
        term: Dreieck
        explanation: Ein Dreieck hat drei Seiten und drei Ecken. Ein rechtwinkliges Dreieck hat einen rechten Winkel.
      - type: definition
        term: Kreis
        explanation: Ein Kreis ist rund. Alle Punkte auf dem Rand sind gleich weit vom Mittelpunkt entfernt. Diese Strecke heißt Radius. Der Durchmesser geht durch den Mittelpunkt von Rand zu Rand und ist doppelt so lang wie der Radius.
      - type: definition
        term: Vieleck
        explanation: Ein Vieleck ist eine ebene Figur mit geraden Seiten. Ein Viereck hat vier Ecken, ein Fünfeck fünf, ein Sechseck sechs.
      - type: example
        title: Ein Fünfeck zählen
        blocks:
          - type: text
            text: |
              Ein Fünfeck hat 5 Ecken. An jeder Ecke stoßen zwei Seiten zusammen, und jede Seite hat zwei Ecken. Darum hat das
              Fünfeck auch 5 Seiten.
      - type: matching
        id: recap-merkmale
        text: Ordne jedem Merkmal die Figur zu.
        pairs:
          - { left: "Drei Ecken", right: Dreieck }
          - { left: "Vier rechte Winkel, gegenüberliegende Seiten gleich lang", right: Rechteck }
          - { left: "Alle Randpunkte sind gleich weit vom Mittelpunkt entfernt", right: Kreis }
          - { left: "Fünf Seiten", right: Fünfeck }
        explanation: Zähle Ecken und Seiten und prüfe die Winkel. Nur der Kreis hat keine geraden Seiten.
        links:
          - title: Ebene Grundfiguren (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/grundfiguren-eben/
      - type: generated
        id: recap-seiten
        given:
          n: { int: [3, 9] }
        task:
          text: "Ein Vieleck hat {{n}} Ecken. Wie viele Seiten hat es?"
        answer: { value: "n", compare: number }
        mistakes:
          - {
              value: "n + 1",
              message: "An jeder Ecke stoßen zwei Seiten zusammen, und jede Seite hat zwei Ecken. Es gibt darum genauso viele Seiten wie Ecken.",
            }
        hint: "Wie viele Seiten stoßen an einer Ecke zusammen, und wie viele Ecken hat jede Seite?"
      - type: generated
        id: recap-durchmesser
        given:
          r: { int: [2, 9] }
        task:
          text: "Ein Kreis hat den Radius {{r}} cm. Wie lang ist sein Durchmesser in Zentimetern?"
        answer: { value: "2 * r", compare: number }
        mistakes:
          - {
              value: "r",
              message: "Das ist der Radius. Der Durchmesser geht durch den Mittelpunkt von Rand zu Rand, er ist doppelt so lang.",
            }
        hint: "Der Durchmesser besteht aus zwei Radien."
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          „Ich kann ebene Grundfiguren erkennen, benennen und ihre Eigenschaften beschreiben.“ Das heißt: Du …

          - erkennst Quadrat, Rechteck, Dreieck, Kreis und Vieleck und nennst ihre Eigenschaften,
          - unterscheidest Seiten (ebene Figur) und Kanten (Körper),
          - weißt, was ein rechter Winkel, parallele Seiten, Radius und Durchmesser sind.

          Fällt dir etwas schwer? Lies nach: [Ebene Grundfiguren](https://lernapps.net/apps/map/mathematik/c/grundfiguren-eben/)
          und [Parallel, senkrecht, Abstand](https://lernapps.net/apps/map/mathematik/c/parallel-senkrecht-abstand/).
