# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Schrägbilder von Prisma und Zylinder
description: Ein Prisma und einen Zylinder auf Kästchenpapier als Schrägbild zeichnen.
competencies: [netze-schraegbilder-prisma-zylinder]
blocks:
  - type: section
    id: einstieg
    title: Gestrichelt und durchgezogen
    blocks:
      - type: text
        text: |
          Du zeichnest Quader schon im Schrägbild. Nach dieser Seite zeichnest du auch ein Prisma und einen Zylinder.
          Schau dir im Bild die Körper 2 und 4 an.
      - type: figure
        image: images/koerper-prisma-zylinder.svg
        alt: "Vier Körper im Schrägbild, nummeriert von 1 bis 4: ein Quader, ein Dreiecksprisma, ein Fünfeckprisma und ein Zylinder. Verdeckte Kanten sind gestrichelt."
        caption: "Vier Körper im Schrägbild. Körper 2 ist ein Prisma, Körper 4 ein Zylinder."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: number
        id: gestrichelte-kanten
        text: Wie viele Kanten des Körpers 2 sind gestrichelt gezeichnet?
        answer: 3
        tolerance: 0
        explanation: Die drei Kanten, die an der hinteren unteren Ecke zusammentreffen, sieht man von vorn nicht. Sie sind gestrichelt.
        mistakes:
          - answer: 9
            message: "Neun Kanten hat das Prisma insgesamt. Gefragt sind nur die gestrichelten."
        links:
          - title: Netze und Schrägbilder von Prisma und Zylinder (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/netze-schraegbilder-prisma-zylinder/
  - type: section
    id: regeln
    title: Dreieck und Ellipse
    blocks:
      - type: text
        text: |
          Beim Prisma zeichnest du die Grundfläche vorn in wahrer Größe. Ein rechtwinkliges Dreieck hat zwei Seiten am rechten Winkel, die Katheten. Die Tiefe zeichnest du wie beim Quader schräg und
          halbiert: so viele Kästchen diagonal, wie die Kante cm lang ist.
          Einen Kreis zeichnest du im Schrägbild als Ellipse. Sie ist so breit wie der Kreis, aber nur halb so hoch.
          Beim Zylinder verschiebst du die Ellipse um die Höhe nach oben. Dann verbindest du die beiden Ränder mit zwei
          senkrechten Linien.
      - type: example
        title: Ein Zylinder mit Radius 2 cm und Höhe 3 cm
        blocks:
          - type: text
            text: |
              Der Durchmesser ist 4 cm, das sind 8 Kästchen. Die Ellipse ist 8 Kästchen breit und 4 Kästchen hoch.
              Die obere Ellipse liegt 3 cm hoch, das sind 6 Kästchen, über der unteren.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: ellipse-breite
        given:
          r: { int: [2, 5] }
        task:
          text: "Ein Kreis hat den Radius {{r}} cm. Wie viele Kästchen breit zeichnest du die Ellipse im Schrägbild?"
        answer: { value: "4 * r", compare: number }
        mistakes:
          - {
              value: "2 * r",
              message: "Das ist der Durchmesser in Zentimetern. Ein Kästchen ist nur 0,5 cm lang, 1 cm sind 2 Kästchen.",
            }
          - {
              value: "r",
              message: "Das ist der Radius in Zentimetern. Rechne zuerst den Durchmesser aus und dann in Kästchen um.",
            }
        hint: "Der Durchmesser ist doppelt so lang wie der Radius. 1 cm sind 2 Kästchen."
      - type: vue-component
        id: schraegbild-prisma
        component: Schraegbild
        props:
          body: prisma
          task: "Zeichne das Schrägbild eines Prismas. Vorn ist ein rechtwinkliges Dreieck mit den Katheten {w} cm und {h} cm. Das Prisma ist {d} cm tief. Wie viele Kästchen liegt die hintere Fläche rechts und oberhalb der vorderen?"
          alt: "Ein Prisma mit einem Dreieck als Grundfläche auf Kästchenpapier im Schrägbild."
          right: Nach rechts
          up: Nach oben
          more: mehr
          less: weniger
          mistakes:
            - "Du hast die Tiefenkante doppelt so lang gezeichnet. Die Tiefe wird halbiert: so viele Kästchen, wie die Kante cm lang ist."
            - "Du bist nur nach rechts gegangen. Eine Tiefenkante läuft schräg, also gleich weit nach rechts und nach oben."
            - "Du bist nur nach oben gegangen. Eine Tiefenkante läuft schräg, also gleich weit nach rechts und nach oben."
            - "Du bist nur halb so weit gegangen. Eine Tiefenkante von {d} cm ist {d} Kästchen diagonal lang."
        examples:
          accepted:
            - { answer: { right: 4, up: 4 }, seed: 1 }
          rejected:
            - { answer: { right: 0, up: 0 } }
            - { answer: { right: 1, up: 3 }, seed: 1 }
      - type: vue-component
        id: schraegbild-zylinder
        component: Schraegbild
        props:
          body: zylinder
          task: "Zeichne das Schrägbild eines Zylinders mit dem Radius {w} cm und der Höhe {h} cm. Die untere Ellipse ist schon da. Wie viele Kästchen liegt der Mittelpunkt der oberen Ellipse rechts und oberhalb des Mittelpunkts der unteren?"
          alt: "Ein Zylinder auf Kästchenpapier im Schrägbild."
          right: Nach rechts
          up: Nach oben
          more: mehr
          less: weniger
          mistakes:
            - "Du bist doppelt so hoch gegangen. Ein Zentimeter Höhe sind zwei Kästchen, nicht vier."
            - "Der Zylinder steht gerade: Die obere Ellipse liegt senkrecht über der unteren, nicht seitlich."
            - "Der Zylinder steht gerade: Die obere Ellipse liegt senkrecht über der unteren, nicht seitlich."
            - "Du hast die Höhe in Zentimetern gezählt, nicht in Kästchen. Ein Zentimeter sind zwei Kästchen."
        examples:
          accepted:
            - { answer: { right: 0, up: 4 }, seed: 1 }
          rejected:
            - { answer: { right: 0, up: 0 } }
            - { answer: { right: 2, up: 4 }, seed: 1 }
      - type: true-false
        id: ellipse-halbe-hoehe
        text: "Im Schrägbild zeichnest du einen Kreis als Ellipse, die genauso hoch wie breit ist."
        answer: false
        explanation: Die Ellipse ist so breit wie der Kreis, aber nur halb so hoch. Die Tiefenrichtung wird wie bei allen Schrägbildern halbiert.
        links:
          - title: Netze und Schrägbilder von Prisma und Zylinder (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/netze-schraegbilder-prisma-zylinder/
