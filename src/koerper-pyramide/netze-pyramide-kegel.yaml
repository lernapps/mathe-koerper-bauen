# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Netze von Pyramide und Kegel
description: Pyramide und Kegel aufklappen und sehen, warum die Kugel kein Netz hat.
competencies: [netze-schraegbilder-pyramide-kegel]
blocks:
  - type: section
    id: einstieg
    title: Eine Pyramide aufklappen
    blocks:
      - type: text
        text: |
          Nach dieser Seite findest du das Netz von Pyramide und Kegel. Du weißt auch, warum die Kugel kein Netz hat.
          Schau dir zuerst das Netz einer Pyramide an.
      - type: figure
        image: images/netz-pyramide.svg
        alt: "Netz einer Pyramide: ein Quadrat in der Mitte, an jeder der vier Seiten ein gleichschenkliges Dreieck."
        caption: Das Netz einer Pyramide mit einem Quadrat als Grundfläche.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: number
        id: dreiecke-zaehlen
        text: Wie viele Dreiecke hat das Netz im Bild?
        answer: 4
        tolerance: 0
        explanation: An jeder der vier Seiten des Quadrats hängt ein Dreieck. Beim Falten laufen ihre Spitzen oben zusammen.
        mistakes:
          - answer: 5
            message: "Fünf Flächen hat das Netz insgesamt, aber eine davon ist das Quadrat. Gefragt sind die Dreiecke."
        links:
          - title: Netze und Schrägbilder von Pyramide und Kegel (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/netze-schraegbilder-pyramide-kegel/
  - type: section
    id: erklaerung
    title: Dreiecke, Kreisausschnitt, Kugel
    blocks:
      - type: text
        text: |
          Bei einer Pyramide hängt an jeder Seite der Grundfläche ein Dreieck. Hat die Grundfläche n Ecken, sind es n
          Dreiecke.
          Beim Kegel ist die Grundfläche ein Kreis. Der Mantel ist ein Kreisausschnitt, ein Stück aus einem großen Kreis
          wie ein Tortenstück. Der runde Rand des Ausschnitts ist so lang wie der Rand der Grundfläche.
          Bei der Kugel geht das nicht: Eine Kugel lässt sich nicht flach legen, ohne zu dehnen oder zu reißen.
      - type: example
        title: Globus und Weltkarte
        blocks:
          - type: text
            text: |
              Die Erde ist fast eine Kugel. Eine Weltkarte legt sie flach hin. Dafür muss man die Fläche an manchen Stellen
              dehnen, darum sehen Länder auf vielen Karten in der Nähe der Pole größer aus, als sie sind. Ein Netz ohne
              Verzerrung gibt es nicht.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: netz-kegel-waehlen
        text: Welches Netz gehört zu einem Kegel?
        material:
          - type: figure
            image: images/netz-kegel-auswahl.svg
            alt: "Drei Netze, A, B und C. A: ein Ausschnitt aus einem großen Kreis, wie ein Stück Kuchen, an dessen rundem Rand ein kleiner Kreis hängt. B: ein Dreieck, an dessen unterer Seite ein Kreis hängt. C: ein schmales Rechteck, an dessen unterem Ende ein Kreis hängt."
            caption: Drei Netze zur Auswahl.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Netz A
            correct: true
            info: Der Mantel des Kegels ist ein Kreisausschnitt, und der kleine Kreis hängt an seinem runden Rand. Dort passen die Ränder zusammen.
          - text: Netz B
            correct: false
            info: Ein Dreieck hat gerade Seiten. Der Mantel eines Kegels ist gekrümmt, mit einem Dreieck würde der Rand des Kreises nicht passen.
          - text: Netz C
            correct: false
            info: Ein Rechteck ergäbe einen Zylinder. Beim Kegel läuft der Mantel in einer Spitze zusammen, dafür braucht er einen Ausschnitt.
        explanation: Der Kegelmantel ist ein Kreisausschnitt. Der runde Rand des Ausschnitts wird um den Grundkreis gebogen.
        links:
          - title: Netze und Schrägbilder von Pyramide und Kegel (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/netze-schraegbilder-pyramide-kegel/
      - type: generated
        id: dreiecke-pyramide
        given:
          n: { int: [3, 9] }
        task:
          text: "Die Grundfläche einer Pyramide ist ein {{n}}-Eck. Wie viele Dreiecke hat ihr Netz?"
        answer: { value: "n", compare: number }
        mistakes:
          - {
              value: "n + 1",
              message: "n + 1 ist die Zahl aller Flächen. Eine davon ist die Grundfläche und kein Dreieck.",
            }
          - {
              value: "2 * n",
              message: "Eine Pyramide hat nur eine Spitze: An jeder Seite der Grundfläche hängt ein Dreieck, mehr nicht.",
            }
        hint: "An jeder Seite der Grundfläche hängt ein Dreieck."
      - type: generated
        id: flaechen-netz-pyramide
        given:
          n: { int: [3, 9] }
        task:
          text: "Das Netz einer Pyramide besteht aus der Grundfläche und den Seitenflächen. Die Grundfläche ist ein {{n}}-Eck. Aus wie vielen Teilen besteht das Netz?"
        answer: { value: "n + 1", compare: number }
        mistakes:
          - { value: "n", message: "Das sind nur die Dreiecke. Die Grundfläche gehört auch zum Netz." }
          - {
              value: "n + 2",
              message: "Das wäre das Netz eines Prismas mit Deckfläche. Die Pyramide hat nur eine Grundfläche.",
            }
        hint: "Zähle die Dreiecke und die Grundfläche."
      - type: single-choice
        id: weltkarte-warum
        text: Warum sind Länder auf einer Weltkarte verzerrt?
        options:
          - text: Eine Kugel lässt sich nicht flach legen, ohne zu dehnen.
            correct: true
            info: Die Erde ist eine Kugel. Für die Karte muss man die Fläche an manchen Stellen dehnen oder stauchen.
          - text: Die Kartenmacher zeichnen ungenau.
            correct: false
            info: Auch mit der genauesten Zeichnung bleibt die Verzerrung, weil es für die Kugel kein Netz gibt.
          - text: Die Erde hat die Form einer Pyramide.
            correct: false
            info: Die Erde ist fast eine Kugel. Eine Pyramide hätte Kanten und Ecken, und ihr Netz wäre ohne Verzerrung möglich.
        explanation: Die Kugel hat als einziger der Grundkörper kein Netz. Jede flache Karte der Erde verzerrt irgendwo.
        links:
          - title: Netze und Schrägbilder von Pyramide und Kegel (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/netze-schraegbilder-pyramide-kegel/
      - type: true-false
        id: kegelmantel-rand
        text: "Der runde Rand des Kreisausschnitts, der den Mantel eines Kegels bildet, ist so lang wie der Rand des Grundkreises."
        answer: true
        explanation: Der Mantel wird um den Grundkreis gebogen. Der runde Rand des Ausschnitts liegt dann genau auf dem Rand der Grundfläche.
        links:
          - title: Netze und Schrägbilder von Pyramide und Kegel (Lernlandkarte)
            url: https://lernapps.net/apps/map/mathematik/c/netze-schraegbilder-pyramide-kegel/
