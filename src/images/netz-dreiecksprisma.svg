<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 204" width="246" role="img" aria-label="Netz eines Prismas mit einem rechtwinkligen Dreieck als Grundfläche: drei Rechtecke nebeneinander, a, b und c genannt, an dem mittleren Rechteck oben und unten je ein Dreieck"><title>Netz eines Dreiecksprismas</title>
<rect x="2" y="70" width="60" height="70" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<rect x="62" y="70" width="80" height="70" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<rect x="142" y="70" width="100" height="70" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="62,70 142,70 62,10" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="62,140 142,140 62,200" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<text x="32" y="110" font-family="sans-serif" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">a</text>
<text x="102" y="110" font-family="sans-serif" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">b</text>
<text x="192" y="110" font-family="sans-serif" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">c</text>
</svg>
