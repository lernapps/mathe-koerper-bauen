<polygon points="60,60 140,60 100.0,0" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="60,140 140,140 100.0,200" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="60,60 60,140 0,100.0" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
<polygon points="140,60 140,140 200,100.0" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="2"/>
</svg>
