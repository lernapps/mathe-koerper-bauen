<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="260" role="img" aria-label="Netz einer Pyramide: ein Quadrat in der Mitte, an jeder der vier Seiten ein gleichschenkliges Dreieck"><title>Netz einer Pyramide</title>
